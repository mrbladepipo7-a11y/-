<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#05070b">
  <meta name="description" content="გალაკტიონისადმი მიძღვნილი მემორიალური pixel-art პროექტი.">
  <title>გალაკტიონი — გვახსოვხარ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Georgian:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="story" id="story">
    <div class="art-wrap">
      <img class="art" src="galaktion-pixel.png" alt="გალაკტიონისადმი მიძღვნილი ღამის pixel-art სცენა">
    </div>

    <div class="shade"></div>
    <canvas id="rain" aria-hidden="true"></canvas>
    <div class="grain"></div>

    <div class="top">
      <span>გალაკტიონი</span>
      <span>1892 — 1959</span>
    </div>

    <div class="center-message">
      <div class="tiny">ქალაქს ისევ წვიმს</div>
      <h1>შემოქმედო…</h1>
      <div class="rule"></div>
      <p>გვახსოვხარ.</p>
    </div>

    <div class="bottom">
      <span>სიტყვა რჩება</span>
      <button id="mute" aria-label="ხმის ღილაკი">დუმილი</button>
    </div>

    <div class="hint">დააჭირე ეკრანს</div>
  </main>

  <script src="script.js"></script>
</body>
</html>
